# 'r' to reload tmux config
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Terminal capabilities. tmux-256color provides the italics that
# screen-256color lacks, and the RGB feature forces true color through hosts
# whose terminfo does not advertise it (xterm-256color under Windows Terminal
# and WSL, for example). Linux needs the ncurses-term package for the terminfo.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Enable mouse mode
set -g mouse on

# Window names stay as set with prefix+, instead of tracking the running
# command. allow-rename only blocks programs; automatic-rename is tmux's own.
setw -g automatic-rename off
setw -g allow-rename off

# Act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start counting pane and window number at 1, and close gaps after a window closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and splits open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.0.0'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "rounded"

# Make the status line pretty and add some modules
set -g @catppuccin_window_current_text "#{window_name}"
set -g @catppuccin_window_text "#{window_name}"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
