# lazygit (https://github.com/jesseduffield/lazygit). Linked to
# ~/.config/lazygit/config.yml; `lazygit --print-config-dir` shows the path in
# use and `lazygit --config` prints every default. The gui.theme block is
# Catppuccin Macchiato with the blue accent, vendored from
# https://raw.githubusercontent.com/catppuccin/lazygit/main/themes-mergable/macchiato/blue.yml
# (https://github.com/catppuccin/lazygit, MIT license, fetched 2026-10-11).
# authorColors inside theme needs lazygit 0.66+; 0.65 ignores it (lazygit
# does not reject unknown keys), so nothing breaks on an older package.
gui:
  nerdFontsVersion: "3" # CaskaydiaCove Nerd Font Mono is a Nerd Fonts v3 build
  showFileTree: true
  theme:
    activeBorderColor:
      - '#8aadf4'
      - bold
    inactiveBorderColor:
      - '#a5adcb'
    searchingActiveBorderColor:
      - '#eed49f'
    optionsTextColor:
      - '#8aadf4'
    selectedLineBgColor:
      - '#363a4f'
    inactiveViewSelectedLineBgColor:
      - '#6e738d'
    cherryPickedCommitFgColor:
      - '#8aadf4'
    cherryPickedCommitBgColor:
      - '#494d64'
    markedBaseCommitFgColor:
      - '#8aadf4'
    markedBaseCommitBgColor:
      - '#eed49f'
    unstagedChangesColor:
      - '#ed8796'
    defaultFgColor:
      - '#cad3f5'
    authorColors:
      '*': '#b7bdf8'
git:
  # delta renders diffs. lazygit 0.65+ configures it as a diff renderer
  # (docs/Config.md and docs/Custom_DiffRenderers.md in the lazygit repo); the
  # old git.paging key is migrated automatically, which would rewrite this
  # file. --paging=never because lazygit pipes the output itself; --dark
  # matches the catppuccin-macchiato delta feature in config/git/config.
  # delta's navigate option has no effect inside lazygit.
  diffRenderers:
    - command: delta --dark --paging=never
      colorArg: always
os:
  editPreset: "nvim"
