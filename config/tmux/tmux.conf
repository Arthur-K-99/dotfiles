# tmux configuration, linked to ~/.config/tmux/tmux.conf. TPM installs the
# plugins beside it under ~/.config/tmux/plugins/: scripts/bootstrap_tools.sh
# does that on a new machine, and prefix + I does it from inside tmux after
# the plugin list changes. The prefix is C-a.

# 'r' to reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Terminal capabilities. tmux-256color provides the italics that
# screen-256color lacks, and the RGB feature forces true color through hosts
# whose terminfo does not advertise it (xterm-256color under Windows Terminal
# and WSL, for example). Linux needs the ncurses-term package for the terminfo.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000

# Enable mouse mode
set -g mouse on

# Window names stay as set with prefix+, instead of tracking the running
# command. allow-rename only blocks programs; automatic-rename is tmux's own.
setw -g automatic-rename off
setw -g allow-rename off

# Act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start counting pane and window number at 1, and close gaps after a window closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Killing the last session switches to another one instead of detaching, so
# sesh (below) can replace sessions freely.
set -g detach-on-destroy off

# New windows and splits open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Plugins. One @plugin per line: TPM reads this file with a regular
# expression. The plugins run in this order when the TPM line at the bottom
# executes, after every option above and below has been set; continuum must
# come last because it hooks into status-right.
set -g @plugin 'tmux-plugins/tpm'
# Sensible defaults: prefix a is the last window, prefix C-p and C-n move
# between windows, prefix R reloads, aggressive-resize follows the smallest
# attached client. Options set above are left alone.
set -g @plugin 'tmux-plugins/tmux-sensible'
# Ctrl-h/j/k/l move between panes without the prefix, and on into Neovim
# splits through the Neovim half of the plugin (config/nvim/lua/plugins/tmux.lua).
# The plugin moves clear-screen to prefix C-l.
set -g @plugin 'christoomey/vim-tmux-navigator'
# y in copy mode and mouse selections copy to the system clipboard: pbcopy on
# macOS, clip.exe under WSL, wl-copy or xsel on Linux.
set -g @plugin 'tmux-plugins/tmux-yank'
# prefix F: fzf over sessions, windows, panes, commands and keybindings.
set -g @plugin 'sainnhe/tmux-fzf'
# prefix `: a floating scratch pane over the current window, the tmux
# counterpart of Ghostty's quick terminal (cmd+`). The scratch session keeps
# the pane's directory. Colors are ANSI names from the terminal palette.
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind '`'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'blue'
set -g @floax-text-color 'default'
set -g @floax-change-path 'true'
# Catppuccin status line. Every @catppuccin option sits before the theme runs
# (below the plugin list); the status modules are appended after it.
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %H:%M"
# The cpu and battery modules read these two plugins.
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
# prefix C-s saves and prefix C-r restores sessions, windows, panes, their
# directories, pane contents and the programs listed by resurrect; continuum
# saves every 15 minutes and restores the last save when the server starts.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# sesh: prefix T picks or creates a session from tmux sessions, zoxide
# directories and sesh's own config in an fzf popup; prefix L returns to the
# last session. The shell runs $(...) when the key is pressed, not tmux.
bind-key T run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '❯ ' \
    --header '  ^a all  ^t tmux  ^g configs  ^x zoxide  ^f find  ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(❯ )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(tmux ❯ )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(configs ❯ )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(zoxide ❯ )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(find ❯ )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(❯ )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
bind-key L run-shell "sesh last"

# Status line. The theme must have run before the module formats below are
# set, so it is run here as well as by TPM; both run lines are skipped while
# the plugins are not installed yet, and the configuration still loads. cpu
# and battery are set with -F so their plugins can fill in the numbers.
if "test -r ~/.config/tmux/plugins/tmux/catppuccin.tmux" "run '~/.config/tmux/plugins/tmux/catppuccin.tmux'"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Machine-local settings, kept out of this repository like ~/.zshrc.local.
source-file -q ~/.config/tmux/local.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if "test -r ~/.config/tmux/plugins/tpm/tpm" "run '~/.config/tmux/plugins/tpm/tpm'" "display-message 'TPM is missing: run scripts/bootstrap_tools.sh in the dotfiles repository'"
