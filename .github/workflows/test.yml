name: Installer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: Unix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install zsh for shell checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check syntax and isolated installer behavior
        run: bash scripts/test.sh

  windows:
    name: Windows (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check syntax and isolated installer behavior
        shell: ${{ matrix.shell }}
        run: '& ./tests/windows.Tests.ps1'
