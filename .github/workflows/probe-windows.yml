name: Probe Windows runner (temporary)

on:
  push:
    branches: [rice/windows-fresh-install]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
    steps:
      - name: How winget upgrades and pins an older Carapace
        continue-on-error: true
        run: |
          winget install --id rsteube.Carapace --exact --version 1.0.6 --silent --accept-package-agreements --accept-source-agreements | Out-Host
          "== install 1.0.6 -> $LASTEXITCODE"
          winget list --id rsteube.Carapace --exact --accept-source-agreements | Out-Host
          "== list --exact -> $LASTEXITCODE"
          winget list --id rsteube.Carapace --accept-source-agreements | Out-Host
          "== list -> $LASTEXITCODE"
          winget list --id Carapace --accept-source-agreements | Out-Host
          "== list --id Carapace -> $LASTEXITCODE"
          winget pin add --id rsteube.Carapace --exact --accept-source-agreements | Out-Host
          "== pin add --exact -> $LASTEXITCODE"
          winget pin list --id rsteube.Carapace --exact --accept-source-agreements | Out-Host
          "== pin list --exact -> $LASTEXITCODE"
          winget pin remove --id rsteube.Carapace --exact --accept-source-agreements | Out-Host
          "== pin remove --exact -> $LASTEXITCODE"
          winget upgrade --id rsteube.Carapace --exact --silent --accept-package-agreements --accept-source-agreements | Out-Host
          "== upgrade --exact -> $LASTEXITCODE"
          winget list --id rsteube.Carapace --accept-source-agreements | Out-Host
          winget upgrade --id rsteube.Carapace --silent --accept-package-agreements --accept-source-agreements | Out-Host
          "== upgrade -> $LASTEXITCODE"
          winget list --id rsteube.Carapace --accept-source-agreements | Out-Host
          winget upgrade --id rsteube.Carapace --silent --accept-package-agreements --accept-source-agreements | Out-Host
          "== upgrade when current -> $LASTEXITCODE"
          winget install --id rsteube.Carapace --exact --silent --accept-package-agreements --accept-source-agreements | Out-Host
          "== install --exact when current -> $LASTEXITCODE"
