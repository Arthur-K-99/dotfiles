name: Probe Windows runner (temporary)

on:
  push:
    branches: [rice/windows-fresh-install]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare
        run: ./tests/fresh_install.ps1 -Stage Prepare
      - name: Install
        run: ./tests/fresh_install.ps1 -Stage Install
      - name: Install dotnet-stack
        continue-on-error: true
        run: dotnet tool install --global dotnet-stack | Out-Host
      - name: Which part of the startup profile keeps PowerShell 7 from exiting
        run: |
          $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User') + ";$HOME\.dotnet\tools"
          $profilePath = (& pwsh -NoProfile -Command '$PROFILE.CurrentUserAllHosts')
          $source = [IO.File]::ReadAllText($profilePath)
          Move-Item -LiteralPath $profilePath -Destination "$profilePath.managed"
          $work = Join-Path $env:RUNNER_TEMP 'hang'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $probe = Join-Path $work 'probe.ps1'
          [IO.File]::WriteAllText($probe, "Write-Output 'script done'`n")
          $stacked = $false
          function Test-Startup {
            param([string]$Name, [string]$Profile)
            [IO.File]::WriteAllText($profilePath, $Profile)
            $info = New-Object Diagnostics.ProcessStartInfo
            $info.FileName = (Get-Command pwsh.exe).Source
            $info.Arguments = "-NoLogo -NonInteractive -File $probe"
            $info.UseShellExecute = $false
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $p = [Diagnostics.Process]::Start($info)
            $p.StandardInput.Close()
            $out = $p.StandardOutput.ReadToEndAsync(); $err = $p.StandardError.ReadToEndAsync()
            if ($p.WaitForExit(40000)) { $result = "exited $($p.ExitCode) in $([int]$clock.Elapsed.TotalSeconds) s" }
            else {
              $result = "HUNG ($($p.Threads.Count) threads)"
              if (-not $script:stacked -and (Get-Command dotnet-stack -ErrorAction SilentlyContinue)) {
                $script:stacked = $true
                "---- managed stacks of the hung pwsh ($Name):"
                dotnet-stack report --process-id $p.Id | Out-String -Width 400
              }
              Stop-Process -Id $p.Id -Force
            }
            $null = $out.Wait(5000); $null = $err.Wait(5000)
            "== ${Name}: $result; stdout: $(if ($out.IsCompleted) { $out.Result.Trim() }); stderr: $(if ($err.IsCompleted) { ($err.Result -replace '\x1b\[[0-9;]*m', '').Trim() })"
          }
          $cfg = Get-Content -Raw "$HOME\.config\oh-my-posh\config.omp.json" | ConvertFrom-Json
          $cfg.PSObject.Properties.Remove('transient_prompt')
          $cfg | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath "$HOME\.config\oh-my-posh\plain.omp.json"
          $omp = '$promptConfig = Join-Path $HOME ".config\oh-my-posh\config.omp.json"; oh-my-posh init pwsh --config $promptConfig | Invoke-Expression'
          Test-Startup 'empty profile' ''
          Test-Startup 'whole profile' $source
          Test-Startup 'only oh-my-posh' $omp
          Test-Startup 'whole profile without oh-my-posh' $source.Replace('oh-my-posh init pwsh --config $promptConfig | Invoke-Expression', '')
          Test-Startup 'only oh-my-posh, no transient prompt' ($omp.Replace('config.omp.json', 'plain.omp.json') + '')
          Test-Startup 'only zoxide' 'zoxide init powershell --cmd cd | Out-String | Invoke-Expression'
          Test-Startup 'only mise' '(& mise activate pwsh) | Out-String | Invoke-Expression'
          Test-Startup 'only direnv' 'Set-Item Env:HOME $HOME; direnv hook pwsh | Out-String | Invoke-Expression'
          Test-Startup 'only modules' 'Import-Module Terminal-Icons; Import-Module posh-git'
          Test-Startup 'only PSReadLine' 'Import-Module PSReadLine'
          Move-Item -LiteralPath "$profilePath.managed" -Destination $profilePath -Force
